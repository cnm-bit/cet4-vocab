name: Build Installer

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows‑latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build‑exe
          path: dist/*.exe
